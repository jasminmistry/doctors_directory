services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: doctor_directory
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${IMAGE_NAME}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD}@db:3306/doctor_directory
      REDIS_URL: redis://redis:6379
      PM2_INSTANCES: ${PM2_INSTANCES:-2}
      NEXT_PUBLIC_DIRECTORY_BASE_URL: ${NEXT_PUBLIC_DIRECTORY_BASE_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_MARKETING_BASE_URL: ${NEXT_PUBLIC_MARKETING_BASE_URL}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      CONSENTZ_AUTH_API_URL: ${CONSENTZ_AUTH_API_URL}
      CONSENTZ_APPLICATION_ID: ${CONSENTZ_APPLICATION_ID:-admin}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
      SMS_SEND_MODE: ${SMS_SEND_MODE:-fallback}
      SMS_TRACKING_SECRET: ${SMS_TRACKING_SECRET}
      EMAIL_TRACKING_SECRET: ${EMAIL_TRACKING_SECRET}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET}
      GA4_MP_API_SECRET: ${GA4_MP_API_SECRET}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID}
      TRACKING_DASHBOARD_TOKEN: ${TRACKING_DASHBOARD_TOKEN}
      PATIENT_SESSION_SECRET: ${PATIENT_SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GSC_SERVICE_ACCOUNT_CREDENTIALS: ${GSC_SERVICE_ACCOUNT_CREDENTIALS}
      GSC_SITE_URL: ${GSC_SITE_URL}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      DIRECTORY_LINK_SECRET: ${DIRECTORY_LINK_SECRET}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES}
      UPLOADS_DIR: /app/uploads/images
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mariadb_data:
  redis_data:
  uploads_data:
